<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucy Osko — Gleam & Lustre Synthesizer</title>
  <script>
    if (!window.external) {
      window.external = {
        invoke: function(x) {
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.external) {
            window.webkit.messageHandlers.external.postMessage(x);
          }
        }
      };
    }
  </script>
  <style>
    :root {
      --bg-dark: #0a0d13;
      --bg-panel: #131720;
      --bg-surface: #1b202e;
      --border-color: #262e40;
      --border-highlight: #3b4763;
      --text-main: #f0f4fc;
      --text-dim: #7f8fa4;
      --accent-glow: #00ffcc;
      --accent-orange: #ff9900;
      --accent-pink: #ff3366;
      --accent-cyan: #00e5ff;
      --accent-green: #00ff88;
      --accent-purple: #cc00ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 14px;
      gap: 12px;
    }

    /* TOP BAR / HEADER */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 26px;
      color: var(--accent-glow);
      text-shadow: 0 0 12px var(--accent-glow);
      animation: logo-glow 3s infinite alternate;
    }

    @keyframes logo-glow {
      from { text-shadow: 0 0 8px var(--accent-glow); }
      to { text-shadow: 0 0 18px var(--accent-glow); }
    }

    .brand-text h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fff, #98b0d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    /* VIEW TABS */
    .view-tab-pills {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .tab-pill {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.5px;
    }

    .tab-pill:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-pill.active {
      background: #28334a;
      color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .transport-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-highlight);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #232b3d;
      border-color: #4a5c80;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-play {
      background: linear-gradient(135deg, #103426, #0e241c);
      border-color: #00ff88;
      color: #00ff88;
    }

    .btn-play.active {
      background: linear-gradient(135deg, #00ff88, #00b35f);
      color: #05140e;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 0.7rem;
    }

    .btn-warn {
      background: #4a3800;
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .btn-clear {
      color: #ff5577;
      border-color: #552233;
    }

    .btn-clear:hover {
      background: #331520;
    }

    .btn-exec {
      background: #005544;
      border-color: #00ffcc;
      color: #00ffcc;
      font-weight: 800;
      padding: 8px 18px;
    }

    .btn-exec:hover {
      background: #00775f;
    }

    .preset-buttons {
      display: flex;
      gap: 5px;
    }

    .tempo-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
    }

    .tempo-box label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .tempo-display {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-glow);
      min-width: 28px;
      text-align: right;
    }

    /* WORKSPACE LAYOUTS */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .split-dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      min-height: 0;
      overflow: hidden;
    }

    .panel-full {
      flex: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header h2 {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #98b0d0;
    }

    .step-counter {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-dim);
      background: var(--bg-surface);
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .badge-stream {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-green);
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.2);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* 4x4 PERFORMANCE PADS */
    .pads-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pads-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 320px;
      touch-action: none;
    }

    .pad-btn {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      transition: all 0.08s ease;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.04), 0 4px 10px rgba(0, 0, 0, 0.4);
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    .pad-btn * {
      pointer-events: none;
    }

    .pad-btn:hover {
      border-color: var(--pad-color, #fff);
      background: #202738;
      transform: translateY(-1px);
    }

    .pad-btn.selected-pad {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.4), inset 0 0 8px rgba(0, 229, 255, 0.15);
    }

    .pad-btn.active-pad {
      background: var(--pad-color, #fff);
      border-color: #fff;
      box-shadow: 0 0 24px var(--pad-color, #fff);
      transform: scale(0.97);
    }

    .pad-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--text-dim);
    }

    .pad-voice-tag {
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: #9cb2d4;
    }

    .pad-edit-badge {
      opacity: 0.5;
      font-size: 0.72rem;
      transition: opacity 0.15s ease, transform 0.15s ease;
      padding: 2px;
    }

    .pad-btn:hover .pad-edit-badge {
      opacity: 1;
      transform: rotate(30deg);
    }

    .pad-label {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.2;
    }

    .pad-sub {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-align: center;
      font-weight: 600;
      line-height: 1.1;
    }

    .pad-btn.active-pad .pad-label,
    .pad-btn.active-pad .pad-sub,
    .pad-btn.active-pad .pad-top-row,
    .pad-btn.active-pad .pad-voice-tag {
      color: #000;
      background: transparent;
    }

    /* PAD CONFIGURATOR PANEL */
    .pad-config-panel {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .config-selected-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .selected-pad-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .pad-color-swatch-bullet {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }

    .section-label {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #7184a4;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .preset-chips-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 110px;
      overflow-y: auto;
      padding: 2px;
    }

    .chip-btn {
      background: #171d29;
      border: 1px solid #283348;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #8fa1be;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.1s ease;
    }

    .chip-btn:hover {
      background: #252e42;
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .config-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .config-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-row.full-width {
      grid-column: 1 / -1;
    }

    .config-row label {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .config-text-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .config-text-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
    }

    .config-cmd-input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .flex-1 {
      flex: 1;
    }

    .color-swatches-box {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-top: 2px;
    }

    .swatch-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .swatch-btn:hover {
      transform: scale(1.15);
    }

    .swatch-btn.active {
      border-color: #fff;
      box-shadow: 0 0 10px #fff;
      transform: scale(1.1);
    }

    .cmd-hint {
      font-size: 0.62rem;
      color: #617392;
      font-style: italic;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* SYNTH CONTROLS */
    .synth-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .slider-label-row label {
      color: var(--text-dim);
    }

    .param-val {
      color: var(--accent-glow);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      background: #1c2333;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    /* CONTROL PLANE EVENTS TABLE */
    .control-plane-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .filter-pill-group {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #2b364c;
      color: var(--accent-green);
    }

    .control-plane-ribbon {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #0f131c;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.72rem;
    }

    .ribbon-label {
      color: var(--accent-glow);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }

    .ribbon-pill {
      background: #182030;
      border: 1px solid #283652;
      color: #b0c4de;
      font-size: 0.68rem;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ribbon-pill:hover {
      background: #24324f;
      border-color: var(--accent-glow);
      color: #fff;
    }

    .ribbon-pill.accent {
      border-color: #634394;
      color: #d19eff;
    }

    .ribbon-pill.accent:hover {
      background: #39245e;
      border-color: var(--accent-purple);
      color: #fff;
    }

    .events-table-wrapper {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: rgba(10, 13, 19, 0.7);
    }

    .events-table {
      width: 100%;
      border-collapse: collapse;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
    }

    .events-table th {
      background: #161b26;
      color: #7f8fa4;
      text-align: left;
      padding: 7px 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .events-table td {
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .event-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .cell-seq {
      color: #657795;
      font-weight: 700;
    }

    .cell-num {
      color: #8fa0be;
    }

    .type-pill {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      color: #000;
      background: var(--type-color, #fff);
      box-shadow: 0 0 6px var(--type-color, #fff);
    }

    .empty-row td {
      text-align: center;
      color: #55667d;
      padding: 30px;
      font-style: italic;
    }

    /* REPL CONSOLE */
    .console-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .quick-queries {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .quick-pill {
      background: #1e2638;
      border: 1px solid #2e3b56;
      color: var(--accent-glow);
      font-size: 0.68rem;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .quick-pill:hover {
      background: #28344e;
      border-color: var(--accent-glow);
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      background: #080b10;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
    }

    .history-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    .history-cmd-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .prompt-symbol {
      color: var(--accent-cyan);
      font-weight: 900;
    }

    .prompt-cmd {
      color: #fff;
      font-weight: 700;
      flex: 1;
    }

    .ret-badge {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .ret-badge.ok {
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .ret-badge.err {
      background: rgba(255, 51, 102, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(255, 51, 102, 0.3);
    }

    .history-response {
      color: #98b0d0;
      font-size: 0.72rem;
      white-space: pre-wrap;
      word-break: break-all;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px;
      border-radius: 4px;
    }

    .command-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #080b10;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 6px;
    }

    .input-prompt {
      color: var(--accent-cyan);
      font-weight: 900;
      font-size: 1rem;
      padding-left: 8px;
    }

    .cmd-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      padding: 6px;
    }

    .cmd-input-field::placeholder {
      color: #405068;
    }

    /* FOOTER TELEMETRY */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.72rem;
      flex-shrink: 0;
    }

    .telemetry-feed {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .status-led-pulse {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    .telemetry-title {
      font-weight: 800;
      color: #657795;
      letter-spacing: 0.5px;
    }

    .status-text {
      color: var(--accent-green);
      font-family: monospace;
      font-size: 0.7rem;
    }

    .stats-summary {
      color: var(--text-dim);
      font-weight: 600;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="skred_api.js"></script>
  <script src="app.min.js"></script>
  <script>
    // Ensure WebAudio is resumed on any initial user touch or interaction
    function unlockAudio() {
      if (window.Module) {
        if (window.Module.audioContext && window.Module.audioContext.state === "suspended") {
          window.Module.audioContext.resume();
        }
      }
      if (window.AL && window.AL.currentCtx && window.AL.currentCtx.audioCtx && window.AL.currentCtx.audioCtx.state === "suspended") {
        window.AL.currentCtx.audioCtx.resume();
      }
    }
    window.addEventListener("pointerdown", unlockAudio, { passive: true });
    window.addEventListener("touchstart", unlockAudio, { passive: true });

    // Robust Performance Pad Pointer & Touch Tracking
    // Prevents performance pads from ever getting stuck on touchscreens or WebKitGTK
    const activeTouches = new Map();

    // 1. First-class touch tracking for WebKitGTK & mobile touchscreens
    document.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const btn = el && el.closest && el.closest(".pad-btn");
        if (btn) {
          activeTouches.set(touch.identifier, btn);
        }
      }
    }, { capture: true, passive: true });

    function releaseBtn(btn) {
      if (!btn) return;
      btn.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, cancelable: true }));
      btn.dispatchEvent(new CustomEvent("pad-release", { bubbles: true, cancelable: true }));
    }

    function handleTouchEnd(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const btn = activeTouches.get(touch.identifier);
        if (btn) {
          activeTouches.delete(touch.identifier);
          releaseBtn(btn);
        }
      }
      if (!e.touches || e.touches.length === 0) {
        activeTouches.clear();
        document.querySelectorAll(".pad-btn.active-pad").forEach(releaseBtn);
      }
    }

    window.addEventListener("touchend", handleTouchEnd, { passive: true, capture: true });
    window.addEventListener("touchcancel", handleTouchEnd, { passive: true, capture: true });

    // 2. Pointer & Mouse event tracking
    window.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse" && e.buttons === 0) {
        document.querySelectorAll(".pad-btn.active-pad").forEach(releaseBtn);
      }
    }, { capture: true, passive: true });

    window.addEventListener("mouseup", () => {
      document.querySelectorAll(".pad-btn.active-pad").forEach(releaseBtn);
    }, { capture: true, passive: true });

    window.addEventListener("pointercancel", () => {
      document.querySelectorAll(".pad-btn.active-pad").forEach(releaseBtn);
    }, { capture: true, passive: true });

    window.addEventListener("blur", () => {
      activeTouches.clear();
      document.querySelectorAll(".pad-btn.active-pad").forEach(releaseBtn);
    });
  </script>
</body>
</html>
